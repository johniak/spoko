[package]
name = "spoko-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bincode = "1"
crossbeam-channel = "0.5.17"
fastcdc = "5.0.0"
fd-lock = "4.0.4"
git2 = { version = "0.21", default-features = false }
interprocess = "2.4.7"
notify = "8.2.1"
notify-rust = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spoko-core = { version = "0.1.0", path = "../spoko-core" }
spoko-crypto = { version = "0.1.0", path = "../spoko-crypto" }
spoko-proto = { version = "0.1.0", path = "../spoko-proto" }
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zstd = "0.14.3"

[dev-dependencies]
rand = "0.8"
tempfile = "3.27.0"
spoko-client = { path = ".", features = ["test-util"] }
spoko-server = { path = "../spoko-server", features = ["test-util"] }
spoko-crypto = { path = "../spoko-crypto", features = ["test-util"] }

[features]
test-util = []
