[package]
name = "spoko"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fd-lock = "4.0.4"
git2 = { version = "0.21", default-features = false }
rpassword = "7"
serde_json = "1.0.154"
spoko-client = { version = "0.1.0", path = "../spoko-client" }
spoko-core = { version = "0.1.0", path = "../spoko-core" }
spoko-crypto = { version = "0.1.0", path = "../spoko-crypto" }
spoko-docker = { version = "0.1.0", path = "../spoko-docker" }
spoko-proto = { version = "0.1.0", path = "../spoko-proto" }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
spoko-server = { path = "../spoko-server", features = ["test-util"] }
spoko-crypto = { path = "../spoko-crypto", features = ["test-util"] }
tempfile = "3.27.0"
