[package]
name = "spoko-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
rand = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spoko-crypto = { version = "0.1.0", path = "../spoko-crypto" }
spoko-proto = { version = "0.1.0", path = "../spoko-proto" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
spoko-server = { path = ".", features = ["test-util"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
axum = "0.8"
rusqlite = "0.41.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[features]
test-util = ["dep:tempfile"]
