[package]
name = "spoko-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
rand = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
spoko-crypto = { version = "0.1.0", path = "../spoko-crypto" }
spoko-proto = { version = "0.1.0", path = "../spoko-proto" }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
spoko-server = { path = ".", features = ["test-util"] }

[features]
test-util = []
