[package]
name = "spoko-docker"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bollard = "0.21.1"
bytes = "1.12.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spoko-client = { version = "0.1.0", path = "../spoko-client" }
spoko-core = { version = "0.1.0", path = "../spoko-core" }
spoko-crypto = { version = "0.1.0", path = "../spoko-crypto" }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt", "time"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
rand = "0.8"
spoko-client = { path = "../spoko-client", features = ["test-util"] }
spoko-proto = { path = "../spoko-proto" }
spoko-server = { path = "../spoko-server", features = ["test-util"] }
