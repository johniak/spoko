[package]
name = "spoko-crypto"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bincode = "1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
data-encoding = "2.11.1"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
rsa = { version = "0.9", features = ["sha2"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "p256", "encryption", "std", "alloc"] }
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[features]
test-util = []
