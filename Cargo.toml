[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/spoko-crypto",
    "crates/spoko-proto",
    "crates/spoko-core",
    "crates/spoko-client",
    "crates/spoko-docker",
    "crates/spoko-server",
    "crates/spoko",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/johniak/spoko"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
