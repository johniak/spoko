name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude spoko-tray --all-targets -- -D warnings
      - run: cargo test --workspace --exclude spoko-tray --no-fail-fast
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # TODO(Task 28): raise to 100 once all crates are in.
      - run: COVERAGE_MIN=99 ./scripts/coverage.sh
  docker:
    runs-on: ubuntu-latest
    env: { SPOKO_DOCKER_TESTS: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p spoko-docker --test real_docker

  volume-portability:
    # experiment for spec §12 (result recorded in docs/notes/volume-portability.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: ./scripts/volume-portability.sh
